[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["lib/**"]

[dev]
  command = "npm run dev:web"
  targetPort = 5173
  port = 8888
  framework = "#custom"

# SPA marshrutlari (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
